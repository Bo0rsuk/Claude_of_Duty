<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 226 169" width="226" height="169" role="img" aria-label="Squawk">
  <title>Squawk</title>
  <!--
    Startup animation: the bill starts shut, opens slowly, then snaps wide as the
    sound marks burst out. It plays once and comes to rest on the logo.
    The bill is three pieces: a fixed hinge plus an upper and a lower half that
    each turn about the centre of their own rounded end, so the joints stay smooth.
  -->
  <style>
    /* The resting state is the finished logo, so reduced motion shows it as-is. */
    @media (prefers-reduced-motion: no-preference) {
      .sq-head { transform-origin: 70.9px 70.25px; animation: sq-tilt 2400ms both; }
      .sq-upper { transform-origin: 107px 59.5px; animation: sq-upper 2400ms both; }
      .sq-lower { transform-origin: 88px 83.2px; animation: sq-lower 2400ms both; }
      .sq-lip { transform-origin: 88px 83.2px; animation: sq-lip 2400ms both; }
      .sq-eye { transform-origin: 71.3px 55px; animation: sq-squint 420ms 1560ms both; }
      .sq-mark { transform-origin: 140.5px 84px; animation: sq-burst 440ms cubic-bezier(.2,.7,.3,1) 1605ms both; }
      .sq-mark:nth-child(2) { animation-delay: 1575ms; }
    }
    @keyframes sq-upper {
      0% { transform: rotate(9deg); }
      12.5% { transform: rotate(9deg); animation-timing-function: cubic-bezier(.45,0,.35,1); }
      60% { transform: rotate(2.7deg); animation-timing-function: linear; }
      65% { transform: rotate(2.52deg); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
      70% { transform: rotate(-1.17deg); animation-timing-function: ease-in-out; }
      79% { transform: rotate(0.27deg); animation-timing-function: ease-in-out; }
      88% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sq-lower {
      0% { transform: rotate(-27deg); }
      12.5% { transform: rotate(-27deg); animation-timing-function: cubic-bezier(.45,0,.35,1); }
      60% { transform: rotate(-8.1deg); animation-timing-function: linear; }
      65% { transform: rotate(-7.56deg); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
      70% { transform: rotate(3.51deg); animation-timing-function: ease-in-out; }
      79% { transform: rotate(-0.81deg); animation-timing-function: ease-in-out; }
      88% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sq-lip {
      0% { transform: rotate(-40.5deg); }
      12.5% { transform: rotate(-40.5deg); animation-timing-function: cubic-bezier(.45,0,.35,1); }
      60% { transform: rotate(-12.15deg); animation-timing-function: linear; }
      65% { transform: rotate(-11.34deg); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
      70% { transform: rotate(5.26deg); animation-timing-function: ease-in-out; }
      79% { transform: rotate(-1.22deg); animation-timing-function: ease-in-out; }
      88% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sq-tilt {
      0% { transform: rotate(0deg); }
      12.5% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.45,0,.35,1); }
      60% { transform: rotate(-2deg); animation-timing-function: linear; }
      65% { transform: rotate(-2.4deg); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
      70% { transform: rotate(1.6deg); animation-timing-function: ease-in-out; }
      88% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sq-squint {
      0%, 100% { transform: scaleY(1); }
      22%, 52% { transform: scaleY(.35); }
    }
    @keyframes sq-burst {
      0% { opacity: 0; transform: scale(.5); }
      30% { opacity: 1; }
      60% { transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
  <g transform="translate(14 14)" fill="currentColor">
    <g class="sq-head">
      <path d="M134.4 40.8A70 70 0 1 0 124.7 115.1C125 114.4 125.7 113.8 125.7 113.1C125.7 112.5 125.1 112 124.6 111.7C123.8 111.2 122.9 111 122 110.6L112.4 106.9C111.5 106.7 110.7 106.3 109.8 106.2C109 106.2 108.1 106.4 107.3 106.6C106.6 106.8 105.9 107.1 105.2 107.5C104.3 107.9 103.6 108.5 102.7 109C101.9 109.4 101.1 109.9 100.3 110.2C99.6 110.5 98.9 110.7 98.1 110.9A49.8 49.8 0 1 1 112.5 43.2C113.1 44.7 113.5 46.2 114.3 47.6C115 48.7 115.8 49.8 116.9 50.6C117.9 51.3 119.1 51.5 120.2 51.7C121.5 51.9 122.9 51.9 124.2 51.8C125.7 51.7 127.1 51.3 128.5 50.9C129.8 50.5 131 50 132.2 49.4C133.1 48.9 134.1 48.5 134.5 47.6C134.9 46.7 134.6 45.6 134.6 44.6C134.6 43.3 134.5 42.1 134.4 40.8Z"/>
      <circle class="sq-eye" cx="71.3" cy="55" r="8.1"/>
