      <path class="sq-upper" d="M102.2 63.5C101.7 62.4 100.8 61.3 100.7 60C100.6 58.8 100.9 57.5 101.5 56.4C102.1 55.3 103.1 54.5 104 53.9C104.9 53.5 105.8 53.3 106.8 53.2C108 53.1 109.3 53.1 110.5 53.3C112 53.6 113.5 54.3 115 54.7C116.3 55.1 117.7 55.4 119 55.6C120.2 55.8 121.4 56 122.6 55.9C124.1 55.8 125.5 55.5 127 55.2C129 54.8 131 54.4 133 53.9C134.4 53.5 135.7 53 137 52.6C138.5 52.1 140 51.5 141.5 51.1C142.7 50.8 143.8 50.5 145 50.3C146.2 50.1 147.3 50 148.5 50.1C149.5 50.2 150.6 50.4 151.5 50.9C152.3 51.4 153 52.1 153.5 52.9C154 53.8 154.4 54.8 154.4 55.8C154.4 56.7 154 57.7 153.6 58.5C153.1 59.5 152.3 60.4 151.5 61.3C150.8 62 150.1 62.6 149.3 63.2C148 64.2 146.7 65 145.3 65.9C143.6 67 141.8 68.1 140 69C137.7 70.1 135.3 71 133 72C130.7 73 128.4 74 126 74.9C123.9 75.7 121.7 76.3 119.5 77C117.3 77.7 115.2 78.4 113 78.9C111.2 79.3 109.3 79.7 107.5 79.9C106.3 80.1 105.2 80 104 80.1C102.7 80.2 101.3 80.2 100 80.3C99 80.4 98 80.4 97 80.5Z"/>
      <path class="sq-lower" d="M96.3 84.3C97.1 84.4 98 84.6 98.8 84.7C100.2 84.9 101.6 84.9 103 85.1C104.7 85.3 106.3 85.5 108 85.7C110.3 86 112.7 86.3 115 86.7C116.7 87 118.4 87.2 120 87.7C122.2 88.3 124.3 89.2 126.5 90C128.2 90.6 129.9 91.2 131.5 92C133.5 92.9 135.3 94 137.2 95.1C138.7 96 140.2 96.8 141.6 97.9C142.8 98.8 144 99.9 144.9 101.1C145.5 101.9 146 102.8 146.1 103.7C146.2 104.5 146.1 105.5 145.6 106.2C145.1 107 144.2 107.6 143.3 107.9C141.8 108.3 140.1 108.2 138.5 108.2C137 108.2 135.5 108 134 107.7C132.3 107.4 130.6 107 129 106.5C127.4 106.1 125.9 105.6 124.4 105C122.4 104.3 120.5 103.4 118.6 102.6C116.6 101.7 114.5 100.8 112.5 100C110.8 99.3 109.1 98.7 107.4 98C105.1 97 102.9 95.9 100.6 95C98.8 94.3 96.9 93.7 95 93.1C93.3 92.6 91.7 92 90 91.5C88.7 91.1 87.3 90.9 86.1 90.3C84.7 89.7 83.3 89.1 82.3 88C81.4 86.8 80.8 85.3 80.6 83.8C80.5 82.4 80.8 80.8 81.6 79.5C82.3 78.2 83.5 77.1 84.9 76.5C86.2 75.9 87.8 75.7 89.3 75.9C90.6 76.1 91.6 77 92.8 77.5Z"/>
      <!-- Tucked inside the lower half; turns a little faster so the mouth seals from the corner outward. -->
      <path class="sq-lip" d="M93 84C94.1 84.2 95.2 84.5 96.3 84.7C97.2 84.9 98.1 84.9 99 85C100 85.2 101 85.3 102 85.5C103 85.8 104 86.1 105 86.3C106 86.6 107 86.8 108 87.2C109 87.6 110 88.1 111 88.5C112 88.9 113 89.3 114 89.7C115 90 116 90.3 117 90.8C117.7 91.1 118.3 91.6 119 92L114 94L104 92L95 89Z"/>
    </g>
    <g>
      <path class="sq-mark" d="M162.1 73.5A2 2 0 0 1 160 70.1L178.2 56A4.4 4.4 0 1 1 182.8 63.5Z"/>
      <path class="sq-mark" d="M163.5 86.4A2.4 2.4 0 0 1 163.4 81.6L192 78.4A5.3 5.3 0 1 1 192.1 89Z"/>
      <path class="sq-mark" d="M159.2 98.4A1.9 1.9 0 0 1 161.2 95.2L181.6 104.4A4.5 4.5 0 1 1 177 112.1Z"/>
    </g>
  </g>
</svg>
