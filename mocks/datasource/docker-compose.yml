# Mock data sources. Settings come from .env (see .env.example);
# on the EC2 instance Terraform writes that file.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - generator
      - redpanda

  generator:
    build: ./generator
    restart: unless-stopped
    environment:
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-2}
      KAFKA_BOOTSTRAP: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-infra.events}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    depends_on:
      redpanda:
        condition: service_healthy

  # Kafka-compatible broker. Clients inside compose use redpanda:9092,
  # clients outside use PUBLIC_HOST:9092.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${PUBLIC_HOST:-localhost}:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "9092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy_data:
  redpanda_data:
